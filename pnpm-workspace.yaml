# pnpm 11 stopped reading the `pnpm` field in package.json; this file is where
# these settings are honoured, confirmed by reading the effective config back
# out of the runner with `pnpm config list`.
#
# Two separate problems are addressed here.
#
# 1. pnpm blocks dependency lifecycle scripts by default, which is the right
#    default: a postinstall hook runs arbitrary code. esbuild's postinstall links
#    its platform binary, so it is allowlisted by name rather than by switching
#    the gate off wholesale.
#
# 2. pnpm 11 treats *any* skipped build script as a fatal error, even one that is
#    allowlisted, and `pnpm run <script>` re-runs install internally to check
#    dependencies - so the same error reappeared at the typecheck step after the
#    install step had already passed with a one-off CLI flag. Putting the setting
#    in project config is what makes it apply to every pnpm invocation, including
#    the implicit ones.
strictDepBuilds: false

onlyBuiltDependencies:
  - esbuild
