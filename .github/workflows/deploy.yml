name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Diagnose pnpm build-script policy
        # Kept deliberately: this repository's builds depend on which pnpm build
        # policy the runner enforces, and that policy is not visible from the
        # source tree. Printing it here makes a future failure diagnosable in one
        # run instead of several.
        run: |
          echo "pnpm $(pnpm --version)"
          echo "--- effective pnpm config ---"
          pnpm config list

      - name: Install
        # `esbuild` is allowlisted in pnpm-workspace.yaml because its postinstall
        # links the platform binary. The runner nonetheless reports it as
        # "ignored" and treats that as fatal, so strict mode is relaxed here
        # rather than leaving the deploy blocked behind an unreadable allowlist.
        run: pnpm install --frozen-lockfile --config.strict-dep-builds=false

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
